<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOLDREST - Iniciar Sessão</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="formulario">
            <h1>GOLDREST</h1>
            <p class="subtitulo">Sistema de Gestão de Restaurante</p>

            <h2>Iniciar Sessão</h2>

            <form id="formLogin">

                <label for="emailLogin">E-mail</label>
                <input type="email" id="emailLogin"
                       placeholder="Digite o seu e-mail" required>

                <label for="senhaLogin">Palavra-passe</label>
                <input type="password" id="senhaLogin"
                       placeholder="Digite a sua palavra-passe" required>

                <button type="submit">Entrar</button>

            </form>

            <p class="alternativa">
                Ainda não tens uma conta?
                <a href="cadastrar.html">Criar conta</a>
            </p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
